<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Brott Island</title>
    <style>
      html, body { margin: 0; padding: 0; background: #0d1418; color: #cfd8d3; font-family: ui-monospace, monospace; height: 100%; overflow: hidden; }

      #app {
        display: grid;
        grid-template-rows: auto 1fr auto;
        height: 100vh;
        width: 100vw;
      }

      /* ---------------- TOP HUD ---------------- */
      #top-hud {
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 18px;
        padding: 8px 14px;
        background: #131c22;
        border-bottom: 1px solid #2a363d;
        font-size: 13px;
      }
      .hud-stat {
        display: flex; flex-direction: row; align-items: center; gap: 6px;
        color: #cfd8d3;
        white-space: nowrap;
      }
      .hud-stat .k { color: #8aa39b; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; }
      .hud-stat .v { color: #e8d97a; font-weight: bold; }
      .hud-sep { flex: 1; }
      .hud-portraits { display: flex; flex-direction: row; align-items: center; gap: 8px; }
      .hud-label { font-size: 11px; color: #8aa39b; text-transform: uppercase; letter-spacing: 0.06em; }

      /* Battery (horizontal pill in top bar) */
      #battery-shell {
        position: relative;
        width: 80px; height: 22px;
        border: 2px solid #cfd8d3;
        border-radius: 3px;
        background: #0d1418;
        overflow: hidden;
        transition: border-color 0.2s;
      }
      #battery-shell::after {
        content: '';
        position: absolute; top: 6px; right: -5px;
        width: 4px; height: 10px;
        background: #cfd8d3;
        border-radius: 0 2px 2px 0;
      }
      #battery-shell[data-zone="red"] { border-color: #c85a5a; animation: pulse-red 1.2s ease-in-out infinite; }
      #battery-shell.shake { animation: shake 0.6s ease-in-out; }
      @keyframes pulse-red {
        0%, 100% { box-shadow: 0 0 4px rgba(200,90,90,0.3); }
        50%      { box-shadow: 0 0 16px rgba(200,90,90,0.9); }
      }
      @keyframes shake {
        0%,100% { transform: translateX(0); }
        20%     { transform: translateX(-4px); }
        40%     { transform: translateX(4px); }
        60%     { transform: translateX(-2px); }
        80%     { transform: translateX(2px); }
      }
      #battery-fill {
        position: absolute; top: 0; bottom: 0; left: 0;
        background: #5aa37a;
        transition: width 0.3s ease, background 0.3s;
      }
      #battery-fill[data-zone="green"]  { background: #5aa37a; }
      #battery-fill[data-zone="yellow"] { background: #d4b256; }
      #battery-fill[data-zone="red"]    { background: #c85a5a; }
      #battery-label {
        position: absolute; inset: 0;
        display: flex; align-items: center; justify-content: center;
        font-size: 12px; font-weight: bold; color: #0d1418;
        text-shadow: 0 0 2px rgba(255,255,255,0.4);
      }
      #battery-rate { font-size: 11px; color: #8aa39b; }

      /* Portrait slot (same visual rules as before) */
      #brott-portraits { display: flex; flex-direction: row; gap: 4px; }
      .portrait-slot {
        position: relative;
        width: 32px; height: 32px;
        background: #0f171c;
        border: 1px dashed #2a363d;
        color: #5a6a6e;
        display: flex; align-items: center; justify-content: center;
        font-size: 10px;
        overflow: hidden;
      }
      .portrait-slot[data-state="filled"] {
        border: 1px solid #5a7d4a;
        background: #1a2820;
        color: #e8d97a;
      }
      .portrait-slot[data-state="empty"] {
        border: 1px dashed #d4b256;
        color: #d4b256;
        animation: empty-pulse 1.8s ease-in-out infinite;
      }
      .portrait-slot[data-state="station-off"] {
        border: 1px solid #5a2e2e;
        background: #1a1212;
        color: #c85a5a;
        opacity: 0.6;
      }
      @keyframes empty-pulse {
        0%,100% { box-shadow: inset 0 0 0 0 rgba(212,178,86,0); }
        50%     { box-shadow: inset 0 0 0 2px rgba(212,178,86,0.5); }
      }
      .portrait-bar {
        position: absolute; bottom: 0; left: 0; height: 3px;
        background: #5aa37a;
        transition: width 0.2s;
      }

      /* ---------------- STAGE (centerpiece) ---------------- */
      #stage-wrap {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0d1418;
        overflow: hidden;
        min-height: 0;
      }
      canvas#stage {
        background: #1a2228;
        border: 1px solid #2a363d;
        image-rendering: pixelated;
        max-width: 100%;
        max-height: 100%;
        /* Native is 640x400 (1.6). Scale up to fill stage area. */
        width: auto;
        height: 100%;
        aspect-ratio: 8 / 5;
        cursor: pointer;
      }

      /* Floating event log */
      #event-log {
        position: absolute;
        bottom: 12px; right: 12px;
        width: 280px; max-height: 90px;
        background: rgba(15, 23, 28, 0.78);
        border: 1px solid rgba(42, 54, 61, 0.8);
        padding: 4px 8px;
        font-size: 10px;
        color: #cfd8d3;
        overflow-y: auto;
        pointer-events: none;
        backdrop-filter: blur(2px);
      }
      .log-line { line-height: 1.4; }

      /* Popover (canvas inspector) */
      #popover {
        position: absolute;
        min-width: 200px;
        background: #131c22;
        border: 1px solid #5a7d4a;
        box-shadow: 0 4px 16px rgba(0,0,0,0.6);
        padding: 8px 10px;
        font-size: 12px;
        color: #cfd8d3;
        z-index: 10;
        display: flex; flex-direction: column; gap: 6px;
      }
      #popover.hidden { display: none; }
      #popover .pop-title {
        display: flex; justify-content: space-between; align-items: center;
        color: #e8d97a; font-weight: bold;
      }
      #popover .pop-close {
        background: transparent; border: none; color: #8aa39b;
        cursor: pointer; font-size: 14px; padding: 0 4px;
      }
      #popover .pop-close:hover { color: #e8d97a; }
      #popover .pop-row {
        display: flex; flex-direction: row; gap: 6px; align-items: center;
      }
      #popover .pop-meta { color: #8aa39b; font-size: 11px; }
      #popover .pop-status {
        font-size: 10px; padding: 1px 6px; border: 1px solid #2a363d; color: #8aa39b;
      }
      #popover .pop-status[data-status="active"] { color: #7aa3c8; border-color: #2f4651; }
      #popover .pop-status[data-status="fouled"] { color: #c87a5a; border-color: #5a3a2e; }
      #popover .pop-status[data-status="broken"] { color: #c85a5a; border-color: #5a2e2e; }
      #popover .pop-status[data-status="offline"] { color: #d4b256; border-color: #5a4a2e; }
      #popover .pop-status[data-status="idle"] { color: #8aa39b; }
      .rename-input {
        background: #0d1418; color: #e8d97a; border: 1px solid #5a7d4a;
        font-family: inherit; font-size: 12px; padding: 2px 6px;
        width: 100%; box-sizing: border-box; outline: none;
      }
      .job-select {
        background: #0d1418; color: #cfd8d3; border: 1px solid #2a363d;
        font-family: inherit; font-size: 11px; padding: 2px 4px;
      }
      .pop-btn {
        background: #2a4a3a; color: #cfd8d3; border: 1px solid #5a7d4a;
        font-family: inherit; font-size: 11px; padding: 4px 8px; cursor: pointer;
      }
      .pop-btn:hover { background: #355d48; }

      /* ---------------- BOTTOM BUILD BAR ---------------- */
      #build-bar {
        display: flex; flex-direction: row; gap: 8px;
        padding: 8px 14px;
        background: #131c22;
        border-top: 1px solid #2a363d;
        align-items: center;
      }
      button.build-btn {
        background: #2a4a3a; color: #cfd8d3; border: 1px solid #5a7d4a;
        font-family: inherit; font-size: 12px; padding: 8px 12px; cursor: pointer;
        white-space: nowrap;
      }
      button.build-btn:hover:not(:disabled) { background: #355d48; }
      button.build-btn:disabled {
        background: #1a2228; color: #5a6a6e; border-color: #2a363d; cursor: not-allowed;
      }
      button.build-btn[title]:hover::after { /* tooltip handled by native title */ }
    </style>
  </head>
  <body>
    <div id="app">

      <header id="top-hud">
        <div class="hud-stat" title="Battery">
          <div id="battery-shell">
            <div id="battery-fill" data-zone="green" style="width: 0%"></div>
            <div id="battery-label">0%</div>
          </div>
          <span id="battery-rate">▲ 0.0 kW</span>
        </div>

        <div class="hud-stat" title="Ticks survived">
          <span class="k">⏱ survived</span><span class="v" id="m-survived">0</span>
        </div>
        <div class="hud-stat" title="Salvage on hand">
          <span class="k">💰 salvage</span><span class="v" id="m-salvage">0</span>
        </div>
        <div class="hud-stat" title="Game phase">
          <span class="k">phase</span><span class="v" id="m-phase">recovery</span>
        </div>

        <div class="hud-sep"></div>

        <div class="hud-portraits">
          <span class="hud-label">Brott Colony</span>
          <div id="brott-portraits"></div>
        </div>
      </header>

      <main id="stage-wrap">
        <canvas id="stage" width="640" height="400"></canvas>
        <div id="event-log"></div>
        <div id="popover" class="popover hidden"></div>
      </main>

      <footer id="build-bar">
        <button id="build-station" class="build-btn" type="button" disabled
          title="Adds +1 Brott slot">Recharge Station 60💰</button>
        <button id="build-wind" class="build-btn" type="button" disabled
          title="🔄 basic, self-sustaining">Wind Turbine 30💰 🔄</button>
        <button id="build-gen" class="build-btn" type="button" disabled
          title="⚡ parasitic powerhouse — needs battery to run">Tidal Generator 50💰 ⚡</button>
        <button id="build-brott" class="build-btn" type="button" disabled
          title="Costs 100 salvage, needs an open slot">Brott 100💰</button>
      </footer>

    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
