<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Brott Island</title>
    <style>
      html, body { margin: 0; padding: 0; background: #0d1418; color: #cfd8d3; font-family: ui-monospace, monospace; }
      #app { display: flex; flex-direction: column; align-items: center; padding: 16px; gap: 8px; }
      .stage-row { display: flex; flex-direction: row; align-items: flex-start; gap: 12px; }
      canvas { background: #1a2228; border: 1px solid #2a363d; image-rendering: pixelated; }
      .hud { font-size: 12px; color: #8aa39b; white-space: pre; }

      /* Dashboard */
      #dashboard {
        width: 280px;
        font-size: 12px;
        color: #cfd8d3;
        background: #131c22;
        border: 1px solid #2a363d;
        padding: 10px 12px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap: 10px;
        max-height: 400px;
        overflow-y: auto;
      }
      #dashboard h3 {
        margin: 0 0 4px 0;
        font-size: 11px;
        font-weight: normal;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #8aa39b;
        border-bottom: 1px solid #2a363d;
        padding-bottom: 3px;
      }
      .metrics { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; }
      .metrics .k { color: #8aa39b; }
      .metrics .v { color: #e8d97a; text-align: right; }

      ul.roster, ul.structs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }

      .roster-row, .struct-row {
        display: flex; flex-direction: row; align-items: center; justify-content: space-between;
        background: #0f171c;
        padding: 4px 6px;
        border: 1px solid #1f2a31;
      }
      .roster-left, .struct-left { display: flex; flex-direction: column; min-width: 0; }
      .roster-name { color: #e8d97a; cursor: pointer; }
      .roster-name:hover { text-decoration: underline; }
      .roster-name.editing { cursor: text; }
      .roster-meta, .struct-meta { color: #8aa39b; font-size: 10px; }
      .struct-name { color: #cfd8d3; }
      .struct-status {
        font-size: 10px;
        padding: 1px 6px;
        border: 1px solid #2a363d;
        color: #8aa39b;
      }
      .struct-status[data-status="active"] { color: #7aa3c8; border-color: #2f4651; }
      .struct-status[data-status="fouled"] { color: #c87a5a; border-color: #5a3a2e; }
      .struct-status[data-status="idle"] { color: #8aa39b; }

      .rename-input {
        background: #0d1418;
        color: #e8d97a;
        border: 1px solid #5a7d4a;
        font-family: inherit;
        font-size: 12px;
        padding: 1px 4px;
        width: 130px;
        outline: none;
      }
      .job-select {
        background: #0d1418;
        color: #cfd8d3;
        border: 1px solid #2a363d;
        font-family: inherit;
        font-size: 10px;
        padding: 0 2px;
      }
      .job-select:disabled {
        color: #5a6a6e;
        opacity: 0.5;
      }

      .build-row { display: flex; flex-direction: column; gap: 4px; }
      #build-gen, #build-brott {
        background: #2a4a3a;
        color: #cfd8d3;
        border: 1px solid #5a7d4a;
        font-family: inherit;
        font-size: 12px;
        padding: 6px 8px;
        cursor: pointer;
      }
      #build-gen:hover:not(:disabled), #build-brott:hover:not(:disabled) { background: #355d48; }
      #build-gen:disabled, #build-brott:disabled {
        background: #1a2228;
        color: #5a6a6e;
        border-color: #2a363d;
        cursor: not-allowed;
      }
      #build-hint, #build-brott-hint { font-size: 10px; color: #8aa39b; }

      .jobs-placeholder { color: #5a6a6e; font-style: italic; font-size: 11px; }

      #event-log {
        background: #0f171c;
        border: 1px solid #1f2a31;
        padding: 4px 6px;
        font-size: 10px;
        color: #8aa39b;
        min-height: 14px;
        max-height: 70px;
        overflow-y: auto;
      }
      .log-line { line-height: 1.4; }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="stage-row">
        <canvas id="stage" width="640" height="400"></canvas>
        <aside id="dashboard">
          <section>
            <h3>Status</h3>
            <div class="metrics">
              <span class="k">tick</span><span class="v" id="m-tick">0</span>
              <span class="k">power</span><span class="v" id="m-power">0</span>
              <span class="k">delivered</span><span class="v" id="m-delivered">0 kWh</span>
              <span class="k">salvage</span><span class="v" id="m-salvage">0</span>
              <span class="k">fouling</span><span class="v" id="m-fouling">0%</span>
              <span class="k">brott energy</span><span class="v" id="m-energy">—</span>
              <span class="k">task</span><span class="v" id="m-task">—</span>
            </div>
          </section>

          <section>
            <h3>Brotts</h3>
            <ul class="roster" id="brott-list"></ul>
          </section>

          <section>
            <h3>Structures</h3>
            <ul class="structs" id="struct-list"></ul>
          </section>

          <section>
            <h3>Build</h3>
            <div class="build-row">
              <button id="build-gen" type="button" disabled>Build Tidal Generator (cost: 50 salvage)</button>
              <span id="build-hint">Need 50 more salvage</span>
              <button id="build-brott" type="button" disabled>Build Brott (cost: 100 salvage)</button>
              <span id="build-brott-hint">Need 100 more salvage</span>
            </div>
          </section>

          <section>
            <h3>Jobs</h3>
            <div class="jobs-placeholder">Assign each Brott a role from the roster above.</div>
          </section>

          <section>
            <h3>Log</h3>
            <div id="event-log"></div>
          </section>
        </aside>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
